name: Desktop release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and application version
        id: version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.GITHUB_REF_NAME;
          const version = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const packageSection = cargo.match(/\[package\]([\s\S]*?)(?:\n\[|$)/)?.[1] ?? '';
          const cargoVersion = packageSection.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${version}` || version !== cargoVersion) {
            throw new Error(`Expected a vMAJOR.MINOR.PATCH tag matching Tauri (${version}) and Cargo (${cargoVersion}); received ${tag}.`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE
      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-draft-status.txt 2>/dev/null; then
            if [ "$(cat release-draft-status.txt)" != "true" ]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Report Studio $RELEASE_TAG" \
              --notes "Download the installer for your operating system from the assets below."
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Install build tools
        run: |
          cargo install --locked trunk --version 0.21.14
          cargo install --locked wasm-bindgen-cli --version 0.2.126
          npm install --global @tauri-apps/cli@2.12.4
      - name: Build installers and attach them to the draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tauriScript: tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Report Studio ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
