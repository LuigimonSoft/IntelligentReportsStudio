[package]
name = "app"
version = "0.1.0"
edition = "2021"
authors = ["IntelligentReports Studio"]
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
web-sys = { version = "0.3.80", features = ["Storage", "Window", "Document", "Element", "HtmlElement", "HtmlDivElement", "DomRect", "DragEvent", "DataTransfer", "PointerEvent", "MouseEvent", "EventTarget", "KeyboardEvent", "HtmlTextAreaElement"] }

serde_json = "1.0"
wasm-bindgen-futures = "0.4"
wasm-bindgen = { workspace = true, optional = true }
http.workspace = true
cfg-if.workspace = true
thiserror.workspace = true

[features]
default = []
csr = ["leptos/csr", "dep:wasm-bindgen"]
