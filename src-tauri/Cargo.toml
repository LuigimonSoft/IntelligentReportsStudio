[package]
name = "intelligent_reports_studio"
version = "0.1.0"
authors = ["IntelligentReports Studio"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
# Shared JSON persistence rules only; no CSR or SSR feature in the native process.
app = { path = "../app", default-features = false }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2.4.0"
tauri-plugin-shell = "2.2.1"
tauri-plugin-process = "2.2.1"

rfd = "0.15"
arboard = { version = "3.6", default-features = false }
tempfile = "3"
base64 = "0.22"

futures-channel = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow"] }
